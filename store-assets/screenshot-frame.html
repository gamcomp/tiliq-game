<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tiliq Store Screenshot</title>
  <style>
    @font-face{font-family:TiliqUI;src:url('../assets/fonts/tiliq-ui-latin-ext.woff2') format('woff2');font-display:swap}
    @font-face{font-family:TiliqArabic;src:url('../assets/fonts/tiliq-ui-arabic.woff2') format('woff2');font-display:swap}
    @font-face{font-family:TiliqDevanagari;src:url('../assets/fonts/tiliq-ui-devanagari.woff2') format('woff2');font-display:swap}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{
      --top-space:16%;
      --side-space:11.5%;
      --bottom-space:3.2%;
      position:relative;
      color:#fff7df;
      background:#073a62 url('../assets/sky-harbor/home-harbor.png') center/cover no-repeat;
      font-family:TiliqUI,TiliqArabic,TiliqDevanagari,"Noto Sans",Arial,sans-serif;
      isolation:isolate;
    }
    body::before{
      content:"";position:absolute;inset:0;z-index:-2;
      background:linear-gradient(180deg,rgba(4,45,79,.72) 0%,rgba(5,68,108,.74) 22%,rgba(3,32,58,.84) 100%);
      backdrop-filter:blur(5px) saturate(.9);
    }
    body::after{
      content:"";position:absolute;inset:0;z-index:-1;
      background:
        radial-gradient(circle at 16% 10%,rgba(145,226,255,.34),transparent 24%),
        radial-gradient(circle at 84% 15%,rgba(246,191,82,.24),transparent 23%),
        linear-gradient(180deg,transparent 62%,rgba(1,22,43,.48));
    }
    .header{
      position:absolute;z-index:2;left:5%;right:5%;top:2.7%;height:calc(var(--top-space) - 2.7%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    }
    .brand{display:flex;align-items:center;gap:.7em;margin-bottom:.45em;color:#f6d886;font-weight:900;letter-spacing:.17em;text-transform:uppercase;font-size:clamp(19px,2.1vw,34px)}
    .brand img{width:1.8em;height:1.8em;object-fit:contain;filter:drop-shadow(0 .12em .2em rgba(0,0,0,.35))}
    h1{
      margin:0;max-width:96%;font-size:clamp(42px,5.8vw,82px);line-height:1.04;font-weight:950;letter-spacing:-.035em;
      text-wrap:balance;text-shadow:0 .07em .08em rgba(0,22,44,.62),0 0 .42em rgba(73,185,234,.2);
    }
    .shot-shell{
      position:absolute;z-index:1;left:var(--side-space);right:var(--side-space);top:var(--top-space);bottom:var(--bottom-space);
      display:flex;align-items:flex-start;justify-content:center;overflow:hidden;border-radius:3.1vw;
      border:.55vw solid rgba(244,190,74,.98);background:#0a4d78;
      box-shadow:0 2vw 4.8vw rgba(0,18,38,.58),0 0 0 .55vw rgba(255,255,255,.18),inset 0 0 0 .3vw rgba(255,255,255,.2);
    }
    .shot-shell img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center;background:#0a4d78}
    .rivet{position:absolute;z-index:3;width:1.1vw;height:1.1vw;min-width:8px;min-height:8px;border-radius:50%;background:#f4d58e;border:.18vw solid #7c5216;box-shadow:inset 0 .12vw .18vw rgba(255,255,255,.75)}
    .rivet.tl{left:calc(var(--side-space) + 1.1%);top:calc(var(--top-space) + .8%)}
    .rivet.tr{right:calc(var(--side-space) + 1.1%);top:calc(var(--top-space) + .8%)}
    .rivet.bl{left:calc(var(--side-space) + 1.1%);bottom:calc(var(--bottom-space) + .8%)}
    .rivet.br{right:calc(var(--side-space) + 1.1%);bottom:calc(var(--bottom-space) + .8%)}
    body[data-platform="app-store"]{--top-space:17%;--side-space:3.7%;--bottom-space:3.4%}
    body[data-platform="app-store"] h1{font-size:clamp(54px,6.1vw,92px)}
    html[dir="rtl"] h1{letter-spacing:0}
  </style>
</head>
<body>
  <header class="header">
    <div class="brand"><img src="../assets/sky-harbor/tiliq-app-icon.png" alt=""><span>Tiliq</span></div>
    <h1 id="tagline"></h1>
  </header>
  <main class="shot-shell"><img id="shot" alt=""></main>
  <i class="rivet tl"></i><i class="rivet tr"></i><i class="rivet bl"></i><i class="rivet br"></i>
  <script>
    (async()=>{
      const params=new URLSearchParams(location.search);
      const locale=params.get('locale')||'en-US';
      const shotNumber=Math.max(1,Math.min(6,Number(params.get('shot'))||1));
      const platform=params.get('platform')==='app-store'?'app-store':'google-play';
      const metadata=await fetch('store-metadata.json').then(r=>r.json());
      const entry=metadata.locales[locale]||metadata.locales['en-US'];
      document.documentElement.lang=locale;
      document.documentElement.dir=entry.gameCode==='AR'?'rtl':'ltr';
      document.body.dataset.platform=platform;
      document.getElementById('tagline').textContent=entry.screenshots[shotNumber-1];
      const names=['home','gameplay','power-ups','daily-rewards','rankings','customize'];
      const file=`raw/${locale}/${String(shotNumber).padStart(2,'0')}-${names[shotNumber-1]}.png`;
      const image=document.getElementById('shot');
      image.src=file;
      image.alt=entry.screenshots[shotNumber-1];
      await document.fonts.ready;
      await image.decode();
      document.body.dataset.ready='1';
    })();
  </script>
</body>
</html>
